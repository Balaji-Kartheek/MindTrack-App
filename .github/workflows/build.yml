name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets can live in Repository secrets OR in Environment "API_KEYS" (both names below).
    # If keys are only under Environments → API_KEYS, this line is required or env vars stay empty.
    environment: API_KEYS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Setup Gradle Wrapper
        run: |
          echo "Setting up Gradle wrapper..."
          
          # Ensure wrapper directory exists
          mkdir -p gradle/wrapper
          
          # Check if wrapper jar exists
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper jar missing, generating..."
            
            # Use gradle command to generate wrapper
            # This requires build.gradle to exist (which it does)
            gradle wrapper --gradle-version 8.2 --distribution-type all
            
            # Verify it was created
            if [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "✓ Wrapper jar generated successfully"
              ls -lh gradle/wrapper/gradle-wrapper.jar
            else
              echo "✗ Failed to generate wrapper jar"
              echo "Current directory: $(pwd)"
              echo "Files in gradle/wrapper:"
              ls -la gradle/wrapper/ || echo "Directory doesn't exist"
              echo "Checking if build.gradle exists:"
              ls -la build.gradle || echo "build.gradle not found"
              exit 1
            fi
          else
            echo "✓ Wrapper jar already exists"
          fi
          
          # Ensure gradlew is executable
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            echo "✓ gradlew is executable"
          else
            echo "✗ gradlew script not found!"
            echo "Generating gradlew script..."
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi
          
          # Final verification
          echo "Verifying wrapper setup..."
          echo "gradlew exists: $([ -f ./gradlew ] && echo 'YES' || echo 'NO')"
          echo "wrapper jar exists: $([ -f ./gradle/wrapper/gradle-wrapper.jar ] && echo 'YES' || echo 'NO')"
          echo "wrapper jar size: $(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 'N/A') bytes"

      - name: Verify Actions secrets are present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
        run: |
          # Empty secrets → Gradle gets placeholders → ApiConfig uses hardcoded demo keys (often revoked).
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY is empty. Add Repository secret GEMINI_API_KEY, OR under Environments → API_KEYS → Environment secrets (this workflow uses environment API_KEYS). Use Secrets tab, not Variables."
            exit 1
          fi
          if [ -z "${HUGGING_FACE_API_KEY}" ]; then
            echo "::error::HUGGING_FACE_API_KEY is empty. Add Repository secret HUGGING_FACE_API_KEY or Environment API_KEYS secret with that exact name."
            exit 1
          fi
          echo "API secrets are set for this job (values not printed)."

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
